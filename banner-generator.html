<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yukon Banner Generator</title>
<style>
@font-face {
  font-family: 'Zalando Sans SemiExpanded';
  src: url('Zalando_Sans_SemiExpanded/ZalandoSansSemiExpanded-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal;
}
@font-face {
  font-family: 'ABC Repro Variable';
  src: url('ABC Repro Variable/ABCReproVariable-Trial.woff2') format('woff2'),
       url('ABC Repro Variable/ABCReproVariable-Trial.ttf') format('truetype');
  font-weight: 100 900; font-style: normal;
}
@font-face {
  font-family: 'ABC Repro Mono Variable';
  src: url('ABC Repro Mono Variable/ABCReproMonoVariable-Trial.woff2') format('woff2'),
       url('ABC Repro Mono Variable/ABCReproMonoVariable-Trial.ttf') format('truetype');
  font-weight: 100 900; font-style: normal;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f0eff8; color: #19068d;
  font-family: 'ABC Repro Variable', sans-serif;
  font-size: 12px; line-height: 1.4; letter-spacing: -0.02em;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
.sidebar {
  background: #fff; border-right: 1px solid rgba(25,6,141,0.12);
  padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 20px;
  overflow-y: auto; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; flex-direction: column; gap: 3px; }
.brand-name { font-family: 'Zalando Sans SemiExpanded', sans-serif; font-size: 17px; font-weight: 400; line-height: 1.1; color: #19068d; }
.brand-sub { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(25,6,141,0.38); }
hr { border: none; border-top: 1px solid rgba(25,6,141,0.1); }
.mode-tabs { display: grid; grid-template-columns: 1fr 1fr; }
.mode-btn {
  padding: 8px 5px; border: 1px solid rgba(25,6,141,0.22); background: #fff;
  color: rgba(25,6,141,0.5); font-family: 'ABC Repro Variable', sans-serif;
  font-size: 10px; letter-spacing: 0.03em; cursor: pointer; text-align: center;
  margin-right: -1px; margin-bottom: -1px;
}
.mode-btn.on { border-color: #19068d; background: #19068d; color: #fff; z-index: 1; position: relative; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(25,6,141,0.45); }
input[type="text"] {
  border: 1px solid rgba(25,6,141,0.22); background: #fff; color: #19068d;
  font-family: 'ABC Repro Variable', sans-serif; font-size: 12px; letter-spacing: -0.02em;
  padding: 7px 9px; outline: none; border-radius: 0; -webkit-appearance: none; width: 100%;
}
input[type="text"]:focus { border-color: #19068d; }
.size-row { display: flex; gap: 5px; }
.size-btn {
  flex: 1; padding: 7px 4px; border: 1px solid rgba(25,6,141,0.22); background: #fff;
  color: rgba(25,6,141,0.5); font-family: 'ABC Repro Variable', sans-serif;
  font-size: 9px; letter-spacing: 0.03em; cursor: pointer; text-align: center; line-height: 1.5;
}
.size-btn.on { border-color: #19068d; background: #19068d; color: #fff; }
.logo-drop {
  border: 1px dashed rgba(25,6,141,0.22); padding: 10px 12px; cursor: pointer;
  text-align: center; color: rgba(25,6,141,0.4); font-size: 10px; letter-spacing: 0.04em;
}
.logo-drop:hover { border-color: #19068d; }
.logo-thumb { max-height: 28px; max-width: 110px; display: block; margin: 7px auto 0; }
input[type="file"] { display: none; }
.btn-gen {
  width: 100%; padding: 11px; background: #19068d; color: #fff; border: none;
  font-family: 'ABC Repro Variable', sans-serif; font-size: 12px; cursor: pointer; letter-spacing: 0;
}
.btn-gen:hover { background: #0f0460; }
.btn-row { display: flex; gap: 6px; }
.btn-out {
  flex: 1; padding: 9px 6px; background: transparent; color: #19068d;
  border: 1px solid rgba(25,6,141,0.22); font-family: 'ABC Repro Variable', sans-serif;
  font-size: 10px; cursor: pointer; letter-spacing: 0.02em; text-align: center;
}
.btn-out:hover { border-color: #19068d; background: rgba(25,6,141,0.04); }
.btn-all {
  width: 100%; padding: 10px; background: #DDFF55; color: #19068d; border: none;
  font-family: 'ABC Repro Variable', sans-serif; font-size: 10px; cursor: pointer;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.btn-all:hover { background: #ccee44; }
.main {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px; min-height: 100vh; gap: 14px;
}
.canvas-wrap { line-height: 0; }
#preview {
  display: block; max-width: 100%; max-height: calc(100vh - 100px);
  border: 1px solid rgba(25,6,141,0.14); box-shadow: 0 2px 20px rgba(25,6,141,0.1);
}
.preview-meta {
  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: rgba(25,6,141,0.4); text-align: center;
}
/* Winner form styles */
.winner-inputs { display: flex; flex-direction: column; gap: 5px; }
.winner-row { display: grid; grid-template-columns: 22px 1fr 60px 64px; gap: 4px; align-items: center; }
.winner-rank { font-size: 10px; color: rgba(25,6,141,0.4); text-align: center; }
.winner-row input { padding: 5px 7px; font-size: 11px; }
.raffle-row { display: grid; grid-template-columns: 1fr 64px; gap: 4px; align-items: center; margin-bottom: 4px; }
.raffle-row input { padding: 5px 7px; font-size: 11px; }
.raffle-del {
  background: transparent; border: 1px solid rgba(25,6,141,0.18); color: rgba(25,6,141,0.4);
  cursor: pointer; font-size: 13px; line-height: 1; padding: 3px 5px; font-family: inherit;
}
.raffle-del:hover { border-color: #19068d; color: #19068d; }
.btn-add {
  background: transparent; border: 1px dashed rgba(25,6,141,0.22); color: rgba(25,6,141,0.5);
  cursor: pointer; font-family: 'ABC Repro Variable', sans-serif; font-size: 10px;
  padding: 6px 10px; width: 100%; letter-spacing: 0.02em; margin-top: 2px;
}
.btn-add:hover { border-color: #19068d; color: #19068d; }
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-name">Banner Generator</div>
    <div class="brand-sub">Yukon · Social</div>
  </div>
  <hr>
  <div class="mode-tabs">
    <button class="mode-btn on" data-mode="launch"    onclick="setMode('launch')">Challenge Launch</button>
    <button class="mode-btn"    data-mode="winner"   onclick="setMode('winner')">Weekly Winner</button>
    <button class="mode-btn"    data-mode="carousel" onclick="setMode('carousel')">Carousel</button>
    <button class="mode-btn"    data-mode="onepager" onclick="setMode('onepager')">One-Pager</button>
  </div>
  <hr>

  <!-- Challenge Launch fields -->
  <div id="launchFields" style="display:flex;flex-direction:column;gap:20px;">
    <div class="field">
      <label>Challenge name</label>
      <input type="text" id="fName" placeholder="ECDSA.fail" value="ECDSA.fail">
    </div>
    <div class="field">
      <label>Subhead</label>
      <input type="text" id="fSub" placeholder="Unsolved since 2022. Now open." value="Unsolved since 2022. Now open.">
    </div>
    <div class="field">
      <label>Collaborator name</label>
      <input type="text" id="fCollab" placeholder="Carnegie Mellon University" value="">
    </div>
    <div class="field">
      <label>Collaborator logo</label>
      <div class="logo-drop" id="logoDrop" onclick="document.getElementById('logoFile').click()">
        <span id="logoLabel">Click to upload</span>
        <img id="logoThumb" class="logo-thumb" style="display:none">
      </div>
      <input type="file" id="logoFile" accept="image/*">
      <div id="logoControls" style="display:none;margin-top:7px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:10px;color:rgba(25,6,141,0.5);white-space:nowrap;">Logo size</span>
          <input type="range" id="logoScale" min="50" max="300" value="100" step="5" style="flex:1;" oninput="document.getElementById('logoScaleVal').textContent=this.value+'%';rerender()">
          <span id="logoScaleVal" style="font-size:10px;color:rgba(25,6,141,0.5);width:32px;">100%</span>
        </div>
        <button id="logoRemove" onclick="removeCollabLogo()" style="margin-top:5px;padding:4px 10px;font-size:11px;border:1px solid #c00;color:#c00;background:none;border-radius:3px;cursor:pointer;">Remove logo</button>
      </div>
    </div>
  </div>

  <!-- Weekly Winner fields -->
  <div id="winnerFields" style="display:none;flex-direction:column;gap:20px;">
    <div class="field">
      <label>Date range</label>
      <input type="text" id="wDate" placeholder="Aug 12 – Aug 20" value="Aug 12 – Aug 20">
    </div>
    <div class="field">
      <label>Top winners</label>
      <div class="winner-inputs">
        <div class="winner-row">
          <span class="winner-rank">#1</span>
          <input type="text" id="w1h" placeholder="@handle" value="@i34-9">
          <input type="text" id="w1p" placeholder="$3,500" value="$3,500">
          <input type="text" id="w1pts" placeholder="12,869" value="12,869">
        </div>
        <div class="winner-row">
          <span class="winner-rank">#2</span>
          <input type="text" id="w2h" placeholder="@handle" value="@newjordan">
          <input type="text" id="w2p" placeholder="$2,000" value="$2,000">
          <input type="text" id="w2pts" placeholder="6,937" value="6,937">
        </div>
        <div class="winner-row">
          <span class="winner-rank">#3</span>
          <input type="text" id="w3h" placeholder="@handle" value="@welttowelt">
          <input type="text" id="w3p" placeholder="$1,500" value="$1,500">
          <input type="text" id="w3pts" placeholder="5,469" value="5,469">
        </div>
      </div>
    </div>
    <div class="field">
      <label>Raffle winners ($1,000 each)</label>
      <div id="raffleList"></div>
    </div>
  </div>

  <!-- Carousel fields -->
  <div id="carouselFields" style="display:none;flex-direction:column;gap:14px;">
    <div style="font-size:11px;color:rgba(25,6,141,0.6);line-height:1.5;">
      <span id="carouselCount">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button class="btn-out" onclick="carouselPrev()" style="padding:7px 14px;font-size:13px;">←</button>
      <span id="carouselFrameLabel" style="flex:1;text-align:center;font-size:10px;color:rgba(25,6,141,0.5);line-height:1.4;"></span>
      <button class="btn-out" onclick="carouselNext()" style="padding:7px 14px;font-size:13px;">→</button>
    </div>
    <button class="btn-out" onclick="fetchChallenges()" style="font-size:10px;padding:6px 10px;">↻ Refresh from yukon.org</button>
  </div>

  <!-- One-Pager fields -->
  <div id="onepagerFields" style="display:none;flex-direction:column;gap:10px;">
    <div style="font-size:11px;color:rgba(25,6,141,0.6);line-height:1.5;">
      Fixed 1200×627. Compact layout (name only) auto-activates at 8+ challenges.
    </div>
    <div id="onepagerInfo" style="font-size:10px;color:rgba(25,6,141,0.4);"></div>
    <button class="btn-out" onclick="fetchChallenges()" style="font-size:10px;padding:6px 10px;">↻ Refresh from yukon.org</button>
  </div>

  <hr>
  <div class="field" id="sizeField">
    <label>Output size</label>
    <div class="size-row">
      <button class="size-btn on" data-sz="wide"     onclick="setSize('wide')">1200×627<br>Wide</button>
      <button class="size-btn"    data-sz="square"   onclick="setSize('square')">1200×1200<br>Square</button>
      <button class="size-btn"    data-sz="portrait" onclick="setSize('portrait')">1080×1350<br>Portrait</button>
    </div>
  </div>
  <button class="btn-gen" id="btnGen" onclick="generate()">Generate new layout</button>
  <div class="btn-row">
    <button class="btn-out" onclick="exportCurrent()">Export PNG</button>
  </div>
  <button class="btn-all" onclick="exportAll()">Export all 3 sizes</button>
</aside>

<main class="main">
  <div class="canvas-wrap"><canvas id="preview"></canvas></div>
  <div class="preview-meta" id="pmeta">1200 × 627 · Wide</div>
</main>

</div>
<script>
// ── Brand tokens ──────────────────────────────────────────────────────────────
const C = {
  indigo: '#19068d',
  winnerBg: '#1800a6',
  winnerRow: '#150090',
  winnerBorder: '#323dd8',
  lime:   '#DDFF55',
  white:  '#ffffff',
  grid:   'rgba(210,213,255,0.6)',
  raffleUrl: 'rgba(177,164,255,0.64)',
};
const F = {
  disp: "'Zalando Sans SemiExpanded', sans-serif",
  body: "'ABC Repro Variable', sans-serif",
  mono: "'ABC Repro Mono Variable', monospace",
};
const EXPORT_SCALE = 4;

const SIZES = {
  wide:     { w: 1200, h: 627,  label: '1200 × 627 · Wide' },
  square:   { w: 1200, h: 1200, label: '1200 × 1200 · Square' },
  portrait: { w: 1080, h: 1350, label: '1080 × 1350 · Portrait' },
};

// ── State ─────────────────────────────────────────────────────────────────────
let activeMode       = 'launch';
let activeSz         = 'wide';
let collabImg        = null;
let eigenImg         = null;
let poweredByImg     = null;
let currentLayout    = null;
let fontsReady       = false;
let challenges       = [];
let carouselFrameIdx = 0;

// ── Randomisation helpers ─────────────────────────────────────────────────────
const rnd    = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 0.999));
const pick   = arr   => arr[Math.floor(Math.random() * arr.length)];

// ── Layout generation (Challenge Launch) ─────────────────────────────────────
// ym always anchors the sidebar. One of {em, co} is placed in the right column
// so all three tiles land in genuinely different canvas regions every generation.
// Every grid line terminates at a canvas edge — no floating ends.
function generateLayout(szId) {
  const { w, h } = SIZES[szId];
  const PAD = 48;

  const TS = szId === 'wide'
    ? { hl: 90,  sh: 36, sm: 24, co: 20, wm: 39 }
    : szId === 'square'
    ? { hl: 108, sh: 43, sm: 24, co: 23, wm: 49 }
    : { hl: 100, sh: 40, sm: 24, co: 23, wm: 45 };

  const sbSide  = pick(['left', 'right']);
  const ctaSide = pick(['top', 'bottom']);

  const sbRange  = { wide: [240, 320], square: [280, 380], portrait: [260, 350] }[szId];
  const ctaRange = { wide: [85, 105],  square: [100, 140], portrait: [100, 140] }[szId];

  const sbW  = rndInt(...sbRange);
  const ctaH = rndInt(...ctaRange);

  const sbX          = sbSide === 'left' ? 0 : w - sbW;
  const sbEdge       = sbSide === 'left' ? sbW : sbX;
  const hlX          = sbSide === 'left' ? sbW : 0;
  const hlW          = w - sbW;
  const ctaY         = ctaSide === 'bottom' ? h - ctaH : 0;
  const ctaBoundaryY = ctaSide === 'bottom' ? h - ctaH : ctaH;
  const sbY          = ctaSide === 'top'    ? ctaH : 0;
  const ncH          = h - ctaH;

  // ── Tile distribution ─────────────────────────────────────────────────────────
  // ym stays in the sidebar. em always stays in the sidebar (narrower cell).
  // co goes to the right column so the three tiles span both halves of the canvas.
  const emInRight   = false;
  const sidebarTile = emInRight ? 'co' : 'em';
  const rightTile   = emInRight ? 'em' : 'co';

  // ── Section counts — target 9 or 10 total cells ──────────────────────────────
  const nLeftEmpty  = rndInt(1, 2); // empty rows in sidebar
  // nRightEmpty is deferred until after hlSectionH so we know the actual space available
  const nLeft       = 2 + nLeftEmpty;  // ym + sidebarTile + empties (3–4)
  const totalTarget = rndInt(9, 10);

  // ── Headline section height ────────────────────────────────────────────────────
  const textBlockMinH = Math.ceil(
    PAD + TS.hl * 0.75
    + TS.hl * 1.08 * 2
    + 32
    + TS.sh * 1.2 * 2
    + 24
  );
  const rightTileMinH = Math.max(100, Math.round(ncH * 0.12));
  const areaMinH   = Math.round(0.40 * w * h / hlW);
  const areaMaxH   = Math.round(0.55 * w * h / hlW);
  const minHlH     = Math.max(areaMinH, textBlockMinH);
  const maxHlH     = Math.min(areaMaxH, ncH - rightTileMinH, Math.round(h * 0.84));
  const hlSectionH = Math.min(
    rndInt(Math.min(minHlH, maxHlH), Math.max(minHlH, maxHlH)),
    ncH - rightTileMinH
  );

  // ── Right column: headline + one content tile + empty sections ────────────────
  const rightRemH = ncH - hlSectionH;
  // Determine nRightEmpty based on actual remaining space (each empty needs ≥48px)
  const nRightEmpty = Math.min(rndInt(1, 2), Math.max(0, Math.floor((rightRemH - rightTileMinH) / 48)));
  const nRight      = 2 + nRightEmpty;
  const nVSplits    = Math.max(0, totalTarget - nLeft - nRight - 1);
  const rightTileH  = Math.max(rightTileMinH, Math.min(
    Math.round(rightRemH * rnd(0.40, 0.65)),
    rightRemH - nRightEmpty * 48
  ));
  const rightEmptyTH = Math.max(0, rightRemH - rightTileH);
  const rightEW = Array.from({ length: nRightEmpty }, () => rnd(0.4, 1.6));
  const totalREW = rightEW.reduce((a, b) => a + b, 0) || 1;
  const rightEH = rightEW.map(wt => Math.round(rightEmptyTH * wt / totalREW));
  if (rightEH.length > 0) rightEH[rightEH.length - 1] += rightEmptyTH - rightEH.reduce((a, b) => a + b, 0);

  // Shuffle right column order; prevent headline from being the very last section
  const rTypes = ['hl', rightTile, ...Array(nRightEmpty).fill('empty')];
  for (let i = rTypes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rTypes[i], rTypes[j]] = [rTypes[j], rTypes[i]];
  }
  if (rTypes[rTypes.length - 1] === 'hl' && rTypes.length > 2) {
    const si = Math.floor(Math.random() * (rTypes.length - 1));
    [rTypes[rTypes.length - 1], rTypes[si]] = [rTypes[si], rTypes[rTypes.length - 1]];
  }

  let ry = sbY, rei = 0;
  const rightSections = rTypes.map(type => {
    const secH = type === 'hl' ? hlSectionH
               : type === rightTile ? rightTileH
               : rightEH[rei++];
    const sec = { type, y: ry, h: secH };
    ry += secH;
    return sec;
  });
  const hlSect        = rightSections.find(s => s.type === 'hl');
  const rightTileSect = rightSections.find(s => s.type === rightTile);

  // ── Left column: ym + one content tile + empty sections ───────────────────────
  const nLBefore = rndInt(0, Math.min(2, nLeftEmpty));
  const nLRem1   = nLeftEmpty - nLBefore;
  const nLMid    = rndInt(0, Math.min(1, nLRem1));
  const nLAfter  = nLRem1 - nLMid;
  const leftTypes = [
    ...Array(nLBefore).fill('empty'), 'ym',
    ...Array(nLMid).fill('empty'), sidebarTile,
    ...Array(nLAfter).fill('empty'),
  ];
  const leftW   = leftTypes.map(t => t === 'empty' ? rnd(0.8, 1.5) : rnd(1.4, 2.2));
  const totalLW = leftW.reduce((a, b) => a + b, 0);
  const leftH   = leftW.map(wt => Math.round(ncH * wt / totalLW));
  leftH[leftH.length - 1] += ncH - leftH.reduce((a, b) => a + b, 0);

  // Enforce Yukon tile is horizontal: height must be strictly less than its width (sbW)
  const ymIdx = leftTypes.indexOf('ym');
  if (leftH[ymIdx] >= sbW) {
    const excess = leftH[ymIdx] - (sbW - 4);
    leftH[ymIdx] = sbW - 4;
    // Redistribute excess to the last empty section in the sidebar
    const emptyIdxs = leftTypes.map((t, i) => t === 'empty' ? i : -1).filter(i => i >= 0);
    const adjustIdx = emptyIdxs.length > 0 ? emptyIdxs[emptyIdxs.length - 1] : leftTypes.length - 1;
    leftH[adjustIdx] += excess;
  }

  let ly = sbY;
  const leftSections = leftTypes.map((type, i) => {
    const sec = { type, y: ly, h: leftH[i] };
    ly += leftH[i];
    return sec;
  });
  const ymSect          = leftSections.find(s => s.type === 'ym');
  const sidebarTileSect = leftSections.find(s => s.type === sidebarTile);

  // ── Resolve em/co tile geometry ───────────────────────────────────────────────
  const emSect  = emInRight ? rightTileSect : sidebarTileSect;
  const emTileX = emInRight ? hlX : sbX;
  const emTileW = emInRight ? hlW : sbW;
  const coSect  = emInRight ? sidebarTileSect : rightTileSect;
  const coTileX = emInRight ? sbX : hlX;
  const coTileW = emInRight ? sbW : hlW;

  // ── Text positioning ───────────────────────────────────────────────────────────
  const textEndFromBase = TS.hl * 1.08 * 2 + 32 + TS.sh * 1.2 * 2 + 24;
  const hlMinBase = hlSect.y + PAD + TS.hl * 0.75;
  const hlMaxBase = Math.max(hlMinBase, hlSect.y + hlSect.h - textEndFromBase);
  const hlTextY   = rnd(hlMinBase, hlMaxBase);
  const ctaTextCY = ctaSide === 'bottom' ? h - ctaH / 2 : ctaH / 2;

  // All copy: flush left, 30px from nearest bounding grid line, 48px from canvas edge.
  // The margin lines (PAD and w-PAD) run full-height and are the bounding lines:
  //   sbSide='left'  → col left bound = sbEdge=hlX, col right bound = w-PAD
  //   sbSide='right' → col left bound = PAD,        col right bound = sbEdge
  const textLeftLine  = sbSide === 'left' ? hlX     : PAD;
  const textRightLine = sbSide === 'left' ? w - PAD : hlX + hlW;
  const hlTextX    = textLeftLine  + 30;
  const hlTextMaxW = Math.max(1, textRightLine - 30 - hlTextX);

  // ── Grid lines ─────────────────────────────────────────────────────────────────
  const gridLines = [];
  gridLines.push({ type: 'v', pos: sbEdge });
  gridLines.push({ type: 'v', pos: PAD });       // left margin — 48px from left edge
  gridLines.push({ type: 'v', pos: w - PAD });   // right margin — 48px from right edge
  gridLines.push({ type: 'h', pos: ctaBoundaryY, x1: 0, x2: w });
  for (let i = 1; i < leftSections.length; i++)
    gridLines.push({ type: 'h', pos: leftSections[i].y, x1: sbX, x2: sbX + sbW });
  for (let i = 1; i < rightSections.length; i++)
    gridLines.push({ type: 'h', pos: rightSections[i].y, x1: hlX, x2: hlX + hlW });

  // Vertical splits: right column empty sections, right portion of column (clears headline text)
  const eligible = rightSections.filter(s => s.type === 'empty');
  eligible.sort(() => Math.random() - 0.5);
  const placedVerts = [sbEdge, PAD, w - PAD]; // include margin lines in exclusion set
  const splitMinX = hlX + Math.round(hlW * 0.72);
  const splitMaxX = hlX + hlW - 30;
  for (let i = 0; i < Math.min(nVSplits, eligible.length); i++) {
    let placed = false;
    for (let attempt = 0; attempt < 30; attempt++) {
      const candidateX = Math.round(rnd(splitMinX, splitMaxX));
      const minDist = Math.min(...placedVerts.map(x => Math.abs(x - candidateX)));
      if (minDist >= 120) {
        gridLines.push({ type: 'v', pos: candidateX });
        placedVerts.push(candidateX);
        placed = true;
        break;
      }
    }
    if (!placed) break;
  }

  // Post-processing: drop any H line within 48px of another H line with overlapping x-range
  {
    const MIN_GAP = 48;
    const hAll = gridLines.filter(l => l.type === 'h').sort((a, b) => a.pos - b.pos);
    const vAll = gridLines.filter(l => l.type === 'v');
    const kept = [];
    for (const line of hAll) {
      const lx1 = line.x1 ?? 0, lx2 = line.x2 ?? w;
      const clash = kept.some(k => {
        const kx1 = k.x1 ?? 0, kx2 = k.x2 ?? w;
        return lx1 < kx2 && kx1 < lx2 && line.pos - k.pos < MIN_GAP;
      });
      if (!clash) kept.push(line);
    }
    gridLines.length = 0;
    gridLines.push(...kept, ...vAll);
  }

  return {
    szId, w, h, PAD, TS, sbSide,
    sbX, sbW, sbEdge, hlX, hlW,
    ym: { x: sbX,     y: ymSect.y,  w: sbW,     h: ymSect.h  },
    em: { x: emTileX, y: emSect.y,  w: emTileW, h: emSect.h  },
    co: { x: coTileX, y: coSect.y,  w: coTileW, h: coSect.h  },
    hl: { x: hlX,     y: hlSect.y,  w: hlW,     h: hlSect.h  },
    ct: { x: hlX,     y: ctaY,      w: hlW,     h: ctaH       },
    hlText:  { x: hlTextX, maxW: hlTextMaxW, y: hlTextY },
    shText:  { x: hlTextX, maxW: hlTextMaxW },
    ctaText: { x: textLeftLine + 30, cy: ctaTextCY },
    elH: szId === 'wide' ? 49 : 64,
    gridLines,
  };
}

// ── Text helpers ──────────────────────────────────────────────────────────────
function setFont(ctx, wt, sz, fam, s) { ctx.font = `${wt} ${sz * s}px ${fam}`; }

function wrapText(ctx, text, maxPx) {
  const words = text.split(' ');
  const lines = []; let cur = '';
  for (const word of words) {
    const test = cur ? `${cur} ${word}` : word;
    if (ctx.measureText(test).width > maxPx && cur) { lines.push(cur); cur = word; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function fitText(ctx, text, wt, fam, maxSz, minSz, maxW, maxLines, s) {
  for (let sz = maxSz; sz >= minSz; sz -= 2) {
    setFont(ctx, wt, sz, fam, s);
    const lines = wrapText(ctx, text, maxW * s);
    if (lines.length <= maxLines) return { sz, lines };
  }
  setFont(ctx, wt, minSz, fam, s);
  return { sz: minSz, lines: wrapText(ctx, text, maxW * s) };
}

// Draw wrapped text lines centered vertically around (leftX, centerY)
function drawTextBlock(ctx, text, leftX, centerY, maxW, fontSize, lineHeight, s) {
  const lines = wrapText(ctx, text, maxW * s);
  const lhPx  = fontSize * lineHeight * s;
  let y = centerY * s - (lines.length * lhPx) / 2 + lhPx / 2;
  ctx.textBaseline = 'middle';
  ctx.textAlign    = 'left';
  for (const line of lines) { ctx.fillText(line, leftX * s, y); y += lhPx; }
}

// ── Challenge Launch renderer ─────────────────────────────────────────────────
function renderBanner(canvas, layout, content, s) {
  const { w, h, PAD, TS, sbSide } = layout;
  // Flush-left anchors: 30px from bounding grid line (margin lines + column separator)
  const sbStartX = ((sbSide === 'left' ? PAD : layout.sbEdge) + 30);  // sidebar left anchor (layout units)
  const sbEndX   = ((sbSide === 'left' ? layout.sbEdge : w - PAD) - 30); // sidebar right limit
  canvas.width  = Math.round(w * s);
  canvas.height = Math.round(h * s);
  const ctx = canvas.getContext('2d');

  // White background
  ctx.fillStyle = C.white;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Yukon tile — indigo fill
  const ym = layout.ym;
  ctx.fillStyle = C.indigo;
  ctx.fillRect(ym.x * s, ym.y * s, ym.w * s, ym.h * s);

  // CTA tile — indigo fill (full width strip)
  const ct = layout.ct;
  ctx.fillRect(ct.x * s, ct.y * s, ct.w * s, ct.h * s);

  // Pre-measure headline text so vertical lines that cut through copy can be skipped
  const hlT = layout.hlText;
  const hlLine1 = content.name || 'Challenge';
  const hlLine2 = 'is live';
  {
    let sz = TS.hl;
    const minSz = Math.round(TS.hl * 0.70);
    setFont(ctx, 400, sz, F.disp, s);
    while (sz > minSz && ctx.measureText(hlLine1).width > hlT.maxW * s) { sz -= 2; setFont(ctx, 400, sz, F.disp, s); }
  }
  const hlTextExcludeX1 = hlT.x * s;
  const hlTextExcludeX2 = hlT.x * s + Math.max(ctx.measureText(hlLine1).width, ctx.measureText(hlLine2).width) + 20 * s;

  // Grid lines — structural tile boundaries + interior accent lines
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 1.95 * s;
  for (const gl of layout.gridLines) {
    const p = Math.round(gl.pos * s) + 0.5;
    ctx.beginPath();
    if (gl.type === 'v') {
      // Skip vertical lines that cut through the headline/subhead copy zone
      if (p >= hlTextExcludeX1 && p <= hlTextExcludeX2) continue;
      ctx.moveTo(p, gl.y1 != null ? gl.y1 * s : 0);
      ctx.lineTo(p, gl.y2 != null ? gl.y2 * s : canvas.height);
    } else {
      ctx.moveTo(gl.x1 != null ? gl.x1 * s : 0, p);
      ctx.lineTo(gl.x2 != null ? gl.x2 * s : canvas.width, p);
    }
    ctx.stroke();
  }

  // Yukon wordmark — lime text, flush left in Yukon tile
  setFont(ctx, 500, TS.wm, F.disp, s);
  ctx.fillStyle = C.lime;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Yukon', sbStartX * s, (ym.y + ym.h / 2) * s);

  // EigenLabs lockup — flush left in EigenLabs tile, capped to tile right limit
  const em = layout.em;
  if (eigenImg && eigenImg.naturalWidth > 0) {
    const imgH = layout.elH * s;
    const maxImgW = (sbEndX - sbStartX) * s;
    const imgW = Math.min(eigenImg.naturalWidth * (imgH / eigenImg.naturalHeight), maxImgW);
    const imgX = sbStartX * s;
    const imgY = (em.y + em.h / 2) * s - imgH / 2;
    ctx.drawImage(eigenImg, imgX, imgY, imgW, imgH);
  } else {
    setFont(ctx, 400, Math.round(layout.elH * 0.48), F.body, s);
    ctx.fillStyle = 'rgba(25,6,141,0.4)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('Powered by EigenLabs', sbStartX * s, (em.y + em.h / 2) * s);
  }

  // Collaborator — label always shown; logo (if any) placed inline to its right
  const co = layout.co;
  {
    const coMidY     = (co.y + co.h / 2) * s;
    const coTxtX     = layout.hlText.x * s;
    const coSz       = Math.max(18, TS.co);
    const label      = content.collab || 'Collaborator';
    const labelAlpha = content.collab ? '0.65' : '0.45';
    setFont(ctx, 400, coSz, F.body, s);
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = `rgba(25,6,141,${labelAlpha})`;
    ctx.fillText(label, coTxtX, coMidY);

    if (collabImg) {
      // Logo sits inline after the label, vertically centred on the same baseline
      const labelW    = ctx.measureText(label).width;
      const gap       = 12 * s;
      const logoScale = (parseFloat(document.getElementById('logoScale').value) || 100) / 100;
      let lh = coSz * 1.7 * s * logoScale;
      let lw = collabImg.naturalWidth * (lh / collabImg.naturalHeight);
      if (lw < 100 * s) { lw = 100 * s; lh = collabImg.naturalHeight * (lw / collabImg.naturalWidth); }
      const lx = coTxtX + labelW + gap;
      const ly = coMidY - lh / 2;
      // Tint logo to #1800A6 via offscreen canvas
      const tmp = document.createElement('canvas');
      tmp.width = Math.ceil(lw); tmp.height = Math.ceil(lh);
      const tc = tmp.getContext('2d');
      tc.drawImage(collabImg, 0, 0, lw, lh);
      tc.globalCompositeOperation = 'source-in';
      tc.fillStyle = '#1800A6';
      tc.fillRect(0, 0, lw, lh);
      ctx.drawImage(tmp, lx, ly);
    }
  }

  // Headline — forced 2-line split (hlT/hlLine1/hlLine2 declared above for grid exclusion)
  // Reduce font size only if challenge name overflows section width
  let hlSz = TS.hl;
  const minHlSz = Math.round(TS.hl * 0.70);
  setFont(ctx, 400, hlSz, F.disp, s);
  while (hlSz > minHlSz && ctx.measureText(hlLine1).width > hlT.maxW * s) {
    hlSz -= 2;
    setFont(ctx, 400, hlSz, F.disp, s);
  }
  ctx.fillStyle = C.indigo;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  let curY = hlT.y * s;
  const hlLH = hlSz * 1.08 * s;
  let hlActualW = 0;
  for (const line of [hlLine1, hlLine2]) {
    hlActualW = Math.max(hlActualW, ctx.measureText(line).width);
    ctx.fillText(line, hlT.x * s, curY);
    curY += hlLH;
  }

  // Subhead — ABC Repro, 2 lines split by sentence ('. '), clamped to headline width
  if (content.sub) {
    const shT = layout.shText;
    setFont(ctx, 400, TS.sh, F.body, s);
    ctx.fillStyle = 'rgba(25,6,141,0.65)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    const maxShW = Math.min(shT.maxW * s, hlActualW || shT.maxW * s);
    const clampLine = txt => {
      while (txt.length > 8 && ctx.measureText(txt).width > maxShW) txt = txt.slice(0, -4) + '…';
      return txt;
    };

    const dotIdx = content.sub.indexOf('. ');
    const shLines = dotIdx !== -1
      ? [content.sub.slice(0, dotIdx + 1), content.sub.slice(dotIdx + 2)]
      : wrapText(ctx, content.sub, maxShW).slice(0, 2);

    const shLH = TS.sh * 1.2 * s;
    let shY = curY + 32 * s;
    for (const line of shLines) {
      if (line.trim()) { ctx.fillText(clampLine(line), shT.x * s, shY); shY += shLH; }
    }
  }

  // CTA text — white on indigo, 18px (wide) / 23px (sq+pt)
  const ctaT = layout.ctaText;
  const pre = 'Solve Yukon challenges at ';
  const url = 'yukon.org';
  setFont(ctx, 400, TS.sm, F.body, s);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillText(pre, ctaT.x * s, ctaT.cy * s);
  const preW = ctx.measureText(pre).width;
  ctx.fillStyle = C.lime;
  ctx.fillText(url, ctaT.x * s + preW, ctaT.cy * s);
}

function renderWinnerBanner(canvas, szId, wc, s) {
  const { w, h } = SIZES[szId];
  canvas.width  = Math.round(w * s);
  canvas.height = Math.round(h * s);
  const ctx = canvas.getContext('2d');
  const p = v => v * s;

  // Background
  ctx.fillStyle = C.winnerBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = '#323DD8';
  ctx.lineWidth = 1.5 * s;
  for (const gl of WINNER_GRIDS[szId]) {
    ctx.beginPath();
    if (gl.type === 'v') {
      const x = Math.round(p(gl.x)) + 0.5;
      ctx.moveTo(x, p(gl.y1)); ctx.lineTo(x, p(gl.y2));
    } else {
      const y = Math.round(p(gl.y)) + 0.5;
      ctx.moveTo(p(gl.x1), y); ctx.lineTo(p(gl.x2), y);
    }
    ctx.stroke();
  }

  // Shared helper: draw text middle-aligned
  const mt = (text, x, y, sz, color, fam, wt, align) => {
    setFont(ctx, wt || 400, sz, fam || F.body, s);
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, p(x), p(y));
  };

  // Draw EigenLabs "Powered by" lockup
  const drawEigen = (labelCx, labelCy, labelSz, logoX, logoY, logoW, logoH) => {
    const img = poweredByImg || null;
    if (img) {
      // Place the combined image occupying the full label+logo footprint
      const imgTop = labelCy - labelSz * 0.9;
      const imgH   = (logoY + logoH) - imgTop;
      const imgW   = img.naturalWidth * (imgH * s / img.naturalHeight) / s;
      ctx.drawImage(img, p(logoX), p(imgTop), p(imgW), p(imgH));
    } else {
      // Fallback: separate text + eigenImg
      setFont(ctx, 400, labelSz, F.body, s);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Powered by', p(labelCx), p(labelCy));
      if (eigenImg) ctx.drawImage(eigenImg, p(logoX), p(logoY), p(logoW), p(logoH));
    }
  };

  // Draw footer with muted URL
  const drawFooter = (x, cy, sz) => {
    const pre = 'Solve Yukon challenges at ';
    const url = 'yukon.org';
    setFont(ctx, 400, sz, F.body, s);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = C.white;
    ctx.fillText(pre, p(x), p(cy));
    const preW = ctx.measureText(pre).width;
    ctx.fillStyle = C.raffleUrl;
    ctx.fillText(url, p(x) + preW, p(cy));
  };

  // Draw a winner table row
  const drawRow = (rowX, rowY, rowW, rowH, accentW, rank, handle, prize, pts,
                   rankX, nameX, prizeX, ptsX, textY, rankSz, dataSz) => {
    ctx.fillStyle = C.winnerRow;
    ctx.fillRect(p(rowX), p(rowY), p(rowW), p(rowH));
    ctx.strokeStyle = C.winnerBorder;
    ctx.lineWidth = 1.2 * s;
    ctx.strokeRect(p(rowX) + 0.5, p(rowY) + 0.5, p(rowW) - 1, p(rowH) - 1);
    ctx.fillStyle = C.lime;
    ctx.fillRect(p(rowX), p(rowY), p(accentW), p(rowH));
    // Rank
    setFont(ctx, 500, rankSz, F.disp, s);
    ctx.fillStyle = C.lime; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(rank, p(rankX), p(textY));
    // Handle
    setFont(ctx, 400, dataSz, F.body, s);
    ctx.fillStyle = C.lime; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(handle, p(nameX), p(textY));
    ctx.fillText(prize,  p(prizeX), p(textY));
    ctx.fillText(pts,    p(ptsX),   p(textY));

  // ── Wide layout ───────────────────────────────────────────────────────────
  if (szId === 'wide') {
    // Date
    mt(wc.dateRange, 79, 53.5, 20, C.lime);
    // Headline
    mt('Yukon Weekly Winner', 71, 110, 64, C.lime, F.disp);
    // EigenLabs
    drawEigen(886, 94.67, 12, 852, 111.4, 140, 26);
    // Table headers
    setFont(ctx, 400, 15, F.body, s);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Rank',   p(111), p(207));
    ctx.fillText('Name',   p(230), p(207));
    ctx.fillText('Prize',  p(528), p(207));
    ctx.fillText('Points', p(661), p(207));
    // Winner rows
    const wRows = [
      { top: 229.9, textY: 268.5 },
      { top: 325.2, textY: 364   },
      { top: 415.4, textY: 454   },
    ];
    const ranks = ['# 1','# 2','# 3'];
    for (let i = 0; i < 3; i++) {
      const r = wRows[i];
      drawRow(79, r.top, 682, 77.198, 17,
        ranks[i], wc.winners[i]?.handle||'', wc.winners[i]?.prize||'', wc.winners[i]?.pts||'',
        113, 230, 528, 661, r.textY, 20, 20);

    // Raffle label (right column)

    mt('Raffle winners',   856, 252.9 - rLH / 2, rLabelSz, C.white);
    mt('$1,000 each',      856, 252.9 + rLH / 2, rLabelSz, C.white);
    // Raffle headers

    ctx.fillText('Name',   p(856),  p(330));

    // Raffle rows

  else if (szId === 'square') {

    mt(wc.dateRange, 94, 89.7, 28, C.lime);

// ── Carousel renderer (1080×1080) ────────────────────────────────────────────
function renderCarouselFrame(canvas, type, challenge, frameNum, total, s) {
  const W = 1080, H = 1080;
  canvas.width  = Math.round(W * s);
  canvas.height = Math.round(H * s);
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#1800a6';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  const seg = (x1, y1, x2, y2) => {
    ctx.beginPath();
    ctx.moveTo(Math.round(x1 * s) + 0.5, Math.round(y1 * s) + 0.5);
    ctx.lineTo(Math.round(x2 * s) + 0.5, Math.round(y2 * s) + 0.5);
    ctx.stroke();
  };
  ctx.strokeStyle = C.grid;
  ctx.lineWidth   = 1.95 * s;
  ctx.lineCap     = 'square';

  seg(0, 197, W, 197);  // H-line top of main zone
  seg(0, 907, W, 907);  // H-line bottom of main zone

  if (type === 'challenge') {
    seg(844, 0, 844, H);        // full-height V divider
  } else {
    seg(296, 0,   296, 907);    // left V (intro/end, top half)
    seg(844, 907, 844, H);      // right V stub (bottom strip)
  }

  // "Powered by EigenLabs" lockup — top-left zone (0–197)
  if (poweredByImg) {
    const lh = Math.round(78 * s);
    const lw = Math.round(poweredByImg.naturalWidth * (lh / poweredByImg.naturalHeight));
    ctx.drawImage(poweredByImg, Math.round(45 * s), Math.round(90 * s), lw, lh);
  }

  if (type === 'intro') {
    setFont(ctx, 400, 90, F.disp, s); ctx.fillStyle = C.lime;
    drawTextBlock(ctx, 'The problems worth solving, open to everyone.', 368, 462.5, 712, 90, 1.1, s);

    setFont(ctx, 400, 36, F.body, s); ctx.fillStyle = C.white;
    drawTextBlock(ctx, 'Open problems. Verified progress. Bring your agents.', 368, 767, 537, 36, 1.4, s);

    setFont(ctx, 500, 36, F.disp, s); ctx.fillStyle = C.lime;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Yukon', Math.round(905 * s), Math.round(993.5 * s));
    carouselCTA(ctx, 51, 993.5, s);

  } else if (type === 'challenge') {
    // Replace hyphens with spaces so slug-style names wrap naturally
    const displayName = challenge.name.replace(/-/g, ' ');
    const { sz: nameSz } = fitText(ctx, displayName, 400, F.disp, 90, 52, 749, 2, s);
    setFont(ctx, 400, nameSz, F.disp, s); ctx.fillStyle = C.lime;
    drawTextBlock(ctx, displayName, 69, 431.5, 749, nameSz, 1.1, s);

    setFont(ctx, 400, 33, F.body, s); ctx.fillStyle = C.white;
    drawTextBlock(ctx, challenge.description, 69, 656, 622, 33, 1.4, s);

    // Challenge counter top-right (x=844–1080, y=0–197)
    setFont(ctx, 400, 24, F.disp, s);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const cl = 875, l1y = (109 + 24 * 0.72), l2y = l1y + 24 * 1.4;
    ctx.fillStyle = C.lime;
    ctx.fillText('Challenge', cl * s, l1y * s);
    const n = String(frameNum).padStart(2, '0');
    const t = String(total).padStart(2, '0');
    ctx.fillStyle = C.white;
    ctx.fillText(n, cl * s, l2y * s);
    const nw = ctx.measureText(n).width;
    ctx.fillText(' / ', cl * s + nw, l2y * s);
    ctx.fillStyle = C.lime;
    ctx.fillText(t, cl * s + nw + ctx.measureText(' / ').width, l2y * s);

    setFont(ctx, 500, 36, F.disp, s); ctx.fillStyle = C.lime;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Yukon', Math.round(69 * s), Math.round(993.5 * s));

  } else { // end
    setFont(ctx, 400, 90, F.disp, s); ctx.fillStyle = C.lime;
    drawTextBlock(ctx, 'Every result verified before it counts.', 368, 473, 651, 90, 1.05, s);

    setFont(ctx, 400, 36, F.body, s); ctx.fillStyle = C.white;
    drawTextBlock(ctx, 'Bring your hardest problem, or bring your agents to one of ours.', 368, 750, 598, 36, 1.2, s);

    setFont(ctx, 500, 36, F.disp, s); ctx.fillStyle = C.lime;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Yukon', Math.round(905 * s), Math.round(993.5 * s));
    carouselCTA(ctx, 51, 993.5, s);
  }
}

function carouselCTA(ctx, lx, cy, s) {
  const sz = 28, lhPx = sz * 1.1 * s;
  setFont(ctx, 400, sz, F.body, s);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = C.white;
  ctx.fillText('Solve Yukon',  lx * s, cy * s - lhPx / 2);
  const pre = 'challenges at ';
  ctx.fillText(pre, lx * s, cy * s + lhPx / 2);
  ctx.fillStyle = '#b1a4ff';
  ctx.fillText('yukon.org', lx * s + ctx.measureText(pre).width, cy * s + lhPx / 2);
}

function renderCarouselFromIdx(canvas, idx, s) {
  const total = challenges.length;
  if (idx === 0)           renderCarouselFrame(canvas, 'intro',     null,                 0,   total, s);
  else if (idx > total)    renderCarouselFrame(canvas, 'end',       null,                 0,   total, s);
  else                     renderCarouselFrame(canvas, 'challenge', challenges[idx - 1], idx, total, s);
}

// ── One-Pager renderer (1200×627) ────────────────────────────────────────────
function renderOnePager(canvas, challengeList, s) {
  const W = 1200, H = 627;
  canvas.width  = Math.round(W * s);
  canvas.height = Math.round(H * s);
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#1800a6';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const compact  = challengeList.length >= 8;
  const COL_X    = [36, 322, 608, 895];
  const CELL_W   = 271;
  const ROW_Y    = compact ? [165, 300, 435] : [165, 376];
  const CELL_H   = compact ? 121 : 197;
  const BORDER   = 2;
  const maxSlots = ROW_Y.length * 4 - 1; // last slot = EigenLabs

  // Header grid lines
  ctx.strokeStyle = C.grid;
  ctx.lineWidth   = 1.95 * s;
  ctx.lineCap     = 'square';
  const gl = (x1, y1, x2, y2) => {
    ctx.beginPath(); ctx.moveTo(x1 * s, y1 * s); ctx.lineTo(x2 * s, y2 * s); ctx.stroke();
  };
  gl(36,  0,   36,  165);   // left edge of Yukon cell
  gl(194, 0,   194, 165);   // right edge of Yukon cell
  gl(36,  120, 194, 120);   // bottom of Yukon cell
  gl(0,   165, W,   165);   // header / grid separator

  // Right-side decorative lines (from Figma)
  gl(1164, 157, 1164, 568);
  gl(985,  344, 985,  H);
  gl(985,  487, W,    487);
  gl(880,  573, W,    573);

  // Challenge cells
  ctx.strokeStyle = '#323dd8';
  ctx.lineWidth   = BORDER * s;

  let slot = 0;
  for (let row = 0; row < ROW_Y.length; row++) {
    for (let col = 0; col < 4; col++) {
      const isEigen = (row === ROW_Y.length - 1 && col === 3);
      const x = COL_X[col], y = ROW_Y[row];

      // Skip empty challenge slots — EigenLabs always draws
      if (!isEigen && slot >= Math.min(challengeList.length, maxSlots)) continue;

      ctx.strokeRect(
        (x + BORDER / 2) * s, (y + BORDER / 2) * s,
        (CELL_W - BORDER) * s, (CELL_H - BORDER) * s
      );

      if (isEigen) {
        if (poweredByImg) {
          const lh = Math.round(CELL_H * 0.45 * s);
          const lw = Math.round(poweredByImg.naturalWidth * (lh / poweredByImg.naturalHeight));
          ctx.drawImage(poweredByImg, Math.round((x + CELL_W / 2) * s - lw / 2), Math.round((y + CELL_H / 2) * s - lh / 2), lw, lh);
        }
        continue;
      }
      const ch = challengeList[slot++];
      const pad = 20;

      if (compact) {
        setFont(ctx, 400, 22, F.disp, s);
        ctx.fillStyle = C.lime; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        let nm = ch.name;
        const mw = (CELL_W - pad * 2) * s;
        while (nm.length > 4 && ctx.measureText(nm).width > mw) nm = nm.slice(0, -4) + '…';
        ctx.fillText(nm, (x + pad) * s, (y + CELL_H / 2) * s);
      } else {
        const nsz = 28;
        setFont(ctx, 400, nsz, F.disp, s);
        ctx.fillStyle = C.lime; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        let nm = ch.name;
        const mw = (CELL_W - pad * 2) * s;
        while (nm.length > 4 && ctx.measureText(nm).width > mw) nm = nm.slice(0, -4) + '…';
        ctx.fillText(nm, (x + pad) * s, (y + pad + nsz * 0.72) * s);

        const dsz = 20, dlh = dsz * 1.2;
        setFont(ctx, 400, dsz, F.body, s);
        ctx.fillStyle = '#b1a4ff';
        const dLines = wrapText(ctx, ch.description, (CELL_W - pad * 2) * s).slice(0, 2);
        const dBot   = y + CELL_H - pad;
        const dFirst = dBot - (dLines.length - 1) * dlh;
        dLines.forEach((ln, i) => ctx.fillText(ln, (x + pad) * s, (dFirst + i * dlh) * s));
      }
    }
  }

  // Yukon wordmark (top-left header cell)
  setFont(ctx, 500, 28, F.disp, s);
  ctx.fillStyle = C.lime; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Yukon', Math.round(55 * s), Math.round(60 * s));

  // Headline
  setFont(ctx, 300, 56, F.disp, s);
  ctx.fillStyle = C.white; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('The frontier, open to everyone.', Math.round(238 * s), Math.round(74 * s));
}

// ── Preview helpers ───────────────────────────────────────────────────────────
function previewScale(szId) {
  const { w, h } = SIZES[szId];
  return previewScaleDim(w, h);
}
function previewScaleDim(w, h) {
  const aw = Math.min(window.innerWidth - 340, 820);
  const ah = window.innerHeight - 80;
  return Math.min(aw / w, ah / h, 1);
}

function getLaunchContent() {
  return {
    name:   document.getElementById('fName').value.trim(),
    sub:    document.getElementById('fSub').value.trim(),
    collab: document.getElementById('fCollab').value.trim(),
  };
}

function getWinnerContent() {
  const raffle = [];
  document.querySelectorAll('#raffleList .raffle-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    raffle.push({ handle: inputs[0].value.trim(), pts: inputs[1].value.trim() });
  });
  return {
    dateRange: document.getElementById('wDate').value.trim() || 'Aug 12 – Aug 20',
    winners: [
      { handle: document.getElementById('w1h').value.trim(), prize: document.getElementById('w1p').value.trim(), pts: document.getElementById('w1pts').value.trim() },
      { handle: document.getElementById('w2h').value.trim(), prize: document.getElementById('w2p').value.trim(), pts: document.getElementById('w2pts').value.trim() },
      { handle: document.getElementById('w3h').value.trim(), prize: document.getElementById('w3p').value.trim(), pts: document.getElementById('w3pts').value.trim() },
    ],
    raffle,
  };
}


// ── Generate / Export ─────────────────────────────────────────────────────────
function updatePreviewMeta() {
  const el = document.getElementById('pmeta');
  if (activeMode === 'carousel') {
    const total = challenges.length + 2;
    el.textContent = `1080 × 1080 · Carousel · Frame ${carouselFrameIdx + 1} of ${total}`;
  } else if (activeMode === 'onepager') {
    const n = challenges.length;
    el.textContent = `1200 × 627 · One-Pager · ${n} challenge${n !== 1 ? 's' : ''}${n >= 8 ? ' (compact)' : ''}`;
  } else {
    el.textContent = SIZES[activeSz].label;
  }
}

function generate() {
  if (!fontsReady) return;
  const cv = document.getElementById('preview');
  if (activeMode === 'launch') {
    currentLayout = generateLayout(activeSz);
    renderBanner(cv, currentLayout, getLaunchContent(), previewScale(activeSz));
  } else if (activeMode === 'winner') {
    currentLayout = null;
    renderWinnerBanner(cv, activeSz, getWinnerContent(), previewScale(activeSz));
  } else if (activeMode === 'carousel') {
    currentLayout = null;
    renderCarouselFromIdx(cv, carouselFrameIdx, previewScaleDim(1080, 1080));
  } else if (activeMode === 'onepager') {
    currentLayout = null;
    renderOnePager(cv, challenges, previewScaleDim(1200, 627));
  }
  updatePreviewMeta();
}

function rerender() {
  if (!fontsReady) return;
  const cv = document.getElementById('preview');
  if (activeMode === 'launch') {
    if (!currentLayout) return;
    renderBanner(cv, currentLayout, getLaunchContent(), previewScale(activeSz));
  } else if (activeMode === 'winner') {
    renderWinnerBanner(cv, activeSz, getWinnerContent(), previewScale(activeSz));
  } else if (activeMode === 'carousel') {
    renderCarouselFromIdx(cv, carouselFrameIdx, previewScaleDim(1080, 1080));
  } else if (activeMode === 'onepager') {
    renderOnePager(cv, challenges, previewScaleDim(1200, 627));
  }
  updatePreviewMeta();
}

function dl(cv, name) {
  const out = document.createElement('canvas');
  out.width  = Math.round(cv.width  / EXPORT_SCALE);
  out.height = Math.round(cv.height / EXPORT_SCALE);
  out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
  const a = document.createElement('a');
  a.download = name; a.href = out.toDataURL('image/png'); a.click();
}

function exportCurrent() {
  const cv = document.createElement('canvas');
  if (activeMode === 'launch') {
    if (!currentLayout) return;
    renderBanner(cv, currentLayout, getLaunchContent(), EXPORT_SCALE);
    dl(cv, `yukon-launch-${activeSz}.png`);
  } else if (activeMode === 'winner') {
    renderWinnerBanner(cv, activeSz, getWinnerContent(), EXPORT_SCALE);
    dl(cv, `yukon-winner-${activeSz}.png`);
  } else if (activeMode === 'carousel') {
    renderCarouselFromIdx(cv, carouselFrameIdx, EXPORT_SCALE);
    const lbl = carouselFrameIdx === 0 ? '00-intro'
              : carouselFrameIdx > challenges.length ? `${String(challenges.length + 1).padStart(2, '0')}-end`
              : String(carouselFrameIdx).padStart(2, '0');
    dl(cv, `yukon-carousel-${lbl}.png`);
  } else if (activeMode === 'onepager') {
    renderOnePager(cv, challenges, EXPORT_SCALE);
    dl(cv, 'yukon-onepager.png');
  }
}

async function exportAll() {
  if (activeMode === 'carousel') {
    const total = challenges.length + 2;
    for (let i = 0; i < total; i++) {
      const cv = document.createElement('canvas');
      renderCarouselFromIdx(cv, i, EXPORT_SCALE);
      const lbl = i === 0 ? '00-intro'
                : i === total - 1 ? `${String(total - 1).padStart(2, '0')}-end`
                : String(i).padStart(2, '0');
      dl(cv, `yukon-carousel-${lbl}.png`);
      await new Promise(r => setTimeout(r, 80));
    }
    return;
  }
  if (activeMode === 'onepager') {
    const cv = document.createElement('canvas');
    renderOnePager(cv, challenges, EXPORT_SCALE);
    dl(cv, 'yukon-onepager.png');
    return;
  }
  for (const szId of ['wide', 'square', 'portrait']) {
    const cv = document.createElement('canvas');
    if (activeMode === 'launch') {
      const layout = generateLayout(szId);
      renderBanner(cv, layout, getLaunchContent(), EXPORT_SCALE);
      dl(cv, `yukon-launch-${szId}.png`);
    } else {
      renderWinnerBanner(cv, szId, getWinnerContent(), EXPORT_SCALE);
      dl(cv, `yukon-winner-${szId}.png`);
    }
    await new Promise(r => setTimeout(r, 80));
  }
}

function setMode(mode) {
  activeMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('launchFields').style.display   = mode === 'launch'   ? 'flex' : 'none';
  document.getElementById('winnerFields').style.display   = mode === 'winner'   ? 'flex' : 'none';
  document.getElementById('carouselFields').style.display = mode === 'carousel' ? 'flex' : 'none';
  document.getElementById('onepagerFields').style.display = mode === 'onepager' ? 'flex' : 'none';

  const hasSizes = mode === 'launch' || mode === 'winner';
  document.getElementById('sizeField').style.display = hasSizes ? '' : 'none';
  document.getElementById('btnGen').style.display    = mode === 'launch' ? '' : 'none';

  document.querySelector('.btn-all').textContent =
    mode === 'carousel' ? 'EXPORT ALL FRAMES' :
    mode === 'onepager' ? 'EXPORT ONE-PAGER'  : 'EXPORT ALL 3 SIZES';

  if (mode === 'carousel') { carouselFrameIdx = 0; updateCarouselNav(); }
  if (mode === 'onepager') updateOnePagerInfo();
  if (mode === 'carousel' || mode === 'onepager') fetchChallenges();
  generate();
}

function carouselPrev() {
  if (carouselFrameIdx > 0) { carouselFrameIdx--; updateCarouselNav(); rerender(); }
}
function carouselNext() {
  if (carouselFrameIdx < challenges.length + 1) { carouselFrameIdx++; updateCarouselNav(); rerender(); }
}

function updateCarouselNav() {
  const total  = challenges.length + 2;
  const names  = ['Intro', ...challenges.map((c, i) => `${String(i + 1).padStart(2, '0')} ${c.name}`), 'End'];
  const lbl    = document.getElementById('carouselFrameLabel');
  const cnt    = document.getElementById('carouselCount');
  if (lbl) lbl.textContent = challenges.length > 0
    ? `${names[carouselFrameIdx] || '—'} · ${carouselFrameIdx + 1} / ${total}`
    : '';
  if (cnt && challenges.length > 0) {
    cnt.style.cssText = '';
    cnt.textContent = `${total} frames`;
  }
}

function updateOnePagerInfo() {
  const el = document.getElementById('onepagerInfo');
  if (!el || challenges.length === 0) return;
  const n = challenges.length;
  el.style.cssText = '';
  el.textContent = `${n} challenge${n !== 1 ? 's' : ''}${n >= 8 ? ' · compact layout active' : ''}`;

function setSize(szId) {
  activeSz = szId;

}

function setChallengeStatus(msg, isError) {
  const cnt = document.getElementById('carouselCount');
  const inf = document.getElementById('onepagerInfo');
  const style = isError ? 'color:#c0392b;font-weight:600;' : '';
  if (cnt) { cnt.style.cssText = style; cnt.textContent = msg; }
  if (inf) { inf.style.cssText = style; inf.textContent = msg; }
}

async function fetchChallenges() {
  setChallengeStatus('Fetching from yukon.org…', false);
  try {
    const r = await fetch('/api/challenges', { cache: 'no-store' });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || `Server error ${r.status}`);
    }
    const data = await r.json();
    challenges = data.challenges || [];
    if (challenges.length === 0) throw new Error('No active challenges returned');
    updateCarouselNav();
    updateOnePagerInfo();
    if (fontsReady && (activeMode === 'carousel' || activeMode === 'onepager')) rerender();
  } catch (err) {
    challenges = [];
    updateCarouselNav();
    let msg = String(err.message || err);
    // Help the user understand a local-dev fetch failure
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('Load failed')) {
      msg = 'Cannot reach /api/challenges. Run "vercel dev" locally, or use the deployed version at yukon-banner-generator.vercel.app';
    }
    setChallengeStatus('Error: ' + msg, true);
  }
}

document.fonts.ready.then(() => {
  fontsReady = true;
  generate();
});
</script>
</body>
